<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FlowerShop{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <div class="container header-inner">
    <div class="logo">FlowerShop</div>
    <nav>
      <a href="/">Каталог</a>
      <a href="#order">Заказать</a>
      <a href="#contacts">Контакты</a>
    </nav>
    <div class="phone">+7 (999) 111-22-33</div>
  </div>
</header>

{% block content %}{% endblock %}

<footer id="contacts">
  <div class="container">
    <p>© 2026 FlowerShop · <a href="tel:+79991234567">+7 (999) 123-45-67</a></p>
  </div>
</footer>

</body>
</html>
