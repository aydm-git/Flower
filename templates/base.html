<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Чечектер — свежие букеты с доставкой за 2 часа">
    <title>{% block title %}Чечектер{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <div class="container header-inner">
    <a href="{{ url_for('shop.home') }}" class="logo">Чечектер</a>
    <nav>
      <a href="{{ url_for('shop.home') }}#catalog">Каталог</a>
      <a href="{{ url_for('shop.home') }}#order">Заказать</a>
      <a href="#contacts">Контакты</a>
    </nav>
    <a href="tel:+79991112233" class="phone">+7 (999) 111-22-33</a>
  </div>
</header>

{% block content %}{% endblock %}

<footer id="contacts">
  <div class="container">
    <p>© 2026 Чечектер · <a href="mailto:chechekter@gmail.com">chechekter@gmail.com</a></p>
  </div>
</footer>

</body>
</html>
