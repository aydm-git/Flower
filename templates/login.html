{% extends "base.html" %}

{% block title %}Вход в админ-панель{% endblock %}

{% block content %}
<section class="section" style="padding: 80px 0;">
  <div class="container" style="max-width: 400px; margin: 0 auto; padding: 40px; background: #fff; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
    <h1 style="text-align: center; margin-bottom: 30px; color: #ff3385;">Вход</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="color: red; text-align: center; margin-bottom: 15px;">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <label style="display: block; margin-bottom: 15px;">
        Логин
        <input type="text" name="username" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
      </label>

      <label style="display: block; margin-bottom: 25px;">
        Пароль
        <input type="password" name="password" required style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
      </label>

      <button type="submit" class="btn" style="width: 100%;">Войти</button>
    </form>
  </div>
</section>
{% endblock %}
